name: agent

# Daily research agent: Claude Code reads the state and the ledger, makes one
# change on a branch, the workflow opens a PR, the gate judges it, and it is
# merged or closed without anyone in the loop. See CLAUDE.md.
on:
  schedule:
    - cron: "0 22 * * *"   # 22:00 UTC = 08:00 Brisbane
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: agent
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      pr: ${{ steps.pr.outputs.number }}
      branch: ${{ steps.pr.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -q -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Check credentials
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add CLAUDE_CODE_OAUTH_TOKEN (from 'claude setup-token') or ANTHROPIC_API_KEY to the repo's Actions secrets."
            exit 1
          fi

      - name: Run the agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          AGENT_MAX_BUDGET_USD: ${{ vars.AGENT_MAX_BUDGET_USD }}
        run: |
          git config user.name "quantloop-agent"
          git config user.email "quantloop-agent@users.noreply.github.com"
          branch="agent/$(date -u +%Y%m%d-%H%M)"
          git checkout -q -b "$branch"
          echo "$branch" > .agent_branch
          # Secrets pasted from a terminal often carry a wrapped line break; strip all whitespace,
          # and drop empty credentials so the CLI does not try to use a blank token.
          CLAUDE_CODE_OAUTH_TOKEN="$(printf %s "$CLAUDE_CODE_OAUTH_TOKEN" | tr -d '[:space:]')"
          ANTHROPIC_API_KEY="$(printf %s "$ANTHROPIC_API_KEY" | tr -d '[:space:]')"
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then unset CLAUDE_CODE_OAUTH_TOKEN; else export CLAUDE_CODE_OAUTH_TOKEN; fi
          if [ -z "$ANTHROPIC_API_KEY" ]; then unset ANTHROPIC_API_KEY; else export ANTHROPIC_API_KEY; fi
          extra_args=()
          if [ -n "$AGENT_MODEL" ]; then extra_args+=(--model "$AGENT_MODEL"); fi
          if [ -n "$AGENT_MAX_BUDGET_USD" ]; then extra_args+=(--max-budget-usd "$AGENT_MAX_BUDGET_USD"); fi
          set +e
          claude -p "$(cat .github/agent_prompt.md)" \
            --permission-mode dontAsk \
            --output-format json \
            "${extra_args[@]}" \
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(python *),Bash(python3 *),Bash(pytest *),Bash(git add *),Bash(git commit *),Bash(git diff *),Bash(git log *),Bash(git status *),Bash(git checkout origin/main -- *),Bash(git show *),Bash(gh pr list *),Bash(gh pr view *),Bash(gh pr diff *),Bash(cat *),Bash(ls *),Bash(head *),Bash(tail *),Bash(wc *),Bash(date *)" \
            > agent_output.json
          status=$?
          set -e
          echo "claude exit status: $status"
          if [ -s agent_output.json ]; then
            echo "## Agent result" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.result // "(no result field)"' agent_output.json | head -c 6000 >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            jq -r '"cost usd: \(.total_cost_usd // "n/a")  turns: \(.num_turns // "n/a")  duration ms: \(.duration_ms // "n/a")"' agent_output.json | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::agent produced no output"
          fi
          rm -f agent_output.json

      - name: Push and open pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="$(cat .agent_branch)"; rm -f .agent_branch
          git status --short
          if [ -n "$(git status --porcelain)" ]; then
            echo "::warning::agent left uncommitted changes; committing them so nothing is lost"
            git add -A && git commit -q -m "agent: uncommitted changes from run" || true
          fi
          if [ -z "$(git log origin/main..HEAD --oneline)" ]; then
            echo "no commits; nothing to propose"
            echo "number=" >> "$GITHUB_OUTPUT"
            echo "branch=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push -q -u origin "$branch"
          title="$(git log -1 --pretty=%s)"
          body="$(git log origin/main..HEAD --pretty='%s%n%n%b')"
          url="$(gh pr create --base main --head "$branch" --title "$title" --body "$body")"
          number="${url##*/}"
          echo "opened PR #$number: $title"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

  gate:
    needs: propose
    if: needs.propose.outputs.pr != ''
    uses: ./.github/workflows/gate.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      pr_number: ${{ needs.propose.outputs.pr }}

  merge:
    needs: [propose, gate]
    if: needs.propose.outputs.pr != '' && needs.gate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.propose.outputs.pr }}
        run: |
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
          echo "merged PR #$PR" | tee -a "$GITHUB_STEP_SUMMARY"

  reject:
    needs: [propose, gate]
    if: always() && needs.propose.outputs.pr != '' && needs.gate.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Close with reason
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.propose.outputs.pr }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "Gate failed (result: ${{ needs.gate.result }}). Details: $RUN_URL . Closed automatically; the next agent run reads this comment."
          gh pr close "$PR" --repo "$GITHUB_REPOSITORY" --delete-branch
          echo "closed PR #$PR after gate failure" | tee -a "$GITHUB_STEP_SUMMARY"
