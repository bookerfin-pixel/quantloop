name: bot

# Hourly paper trading loop. Pulls Kraken data, runs the champion and every
# challenger slot, rules on finished tests, rewrites the summary, commits state.
#
# Two triggers on purpose. GitHub's own schedule is best effort and dropped runs
# for hours at a time from 2026-10-03, so an outside scheduler (cron-job.org)
# also starts this workflow every hour through workflow_dispatch. Whichever
# arrives second finds the hour already done and stops before the commit;
# hours that neither delivered are replayed by the next run (see bot/run.py).
# A run that cannot get the candle that just closed fails on purpose: a red
# run here means Kraken's feed was down or behind, and the next run catches up.
on:
  schedule:
    - cron: "7 * * * *"   # :07 past every hour; GitHub delays jobs scheduled on the hour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: state-writer
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      # The tip of main when the job starts, not the commit that triggered it.
      # A second trigger waits in the queue behind the first (concurrency above);
      # checked out at its own trigger commit it would not see the hour the first
      # one just recorded, would decide it again, and then fail to push.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -q -r requirements.txt

      - name: Run accounts
        id: run
        run: python -m bot.run

      - name: Rule on challengers and the shadow
        if: steps.run.outputs.skipped != '1'
        run: python -m bot.promote

      - name: Summary
        if: steps.run.outputs.skipped != '1'
        run: |
          python -m bot.report
          echo '## quantloop hourly run' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python -m bot.slot >> "$GITHUB_STEP_SUMMARY"
          tail -n +3 state/summary.md | head -100 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Commit state
        if: steps.run.outputs.skipped != '1'
        run: |
          git config user.name "quantloop-bot"
          git config user.email "quantloop-bot@users.noreply.github.com"
          git add -A state configs LEDGER.md
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -q -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3 4; do
            if git pull --rebase -q && git push -q; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            sleep $((attempt * 15))
          done
          echo "push failed after 4 attempts"
          exit 1
