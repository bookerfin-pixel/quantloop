name: gate

# The exam a pull request sits before it can merge. Called by agent.yml for
# the agent's own PRs and merged there if it passes. Everything here executes
# from the base branch, so a PR cannot change the rules it is judged by.
# (It used to also run read-only on pull_request events; GitHub held those
# runs for approval because the PR author is github-actions[bot], and they
# expired as failures next to PRs the real gate had already merged.)
on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
    outputs:
      why:
        description: "When the gate fails, the last lines it printed: the closing comment carries them, so the agent learns why."
        value: ${{ jobs.gate.outputs.why }}

permissions:
  contents: read
  pull-requests: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR: ${{ inputs.pr_number || github.event.pull_request.number }}
    outputs:
      why: ${{ steps.why.outputs.why }}
    steps:
      - name: Check out base (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: base
          fetch-depth: 1

      - name: Check out pull request head
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr_number || github.event.pull_request.number }}/head
          path: pr
          fetch-depth: 0

      - name: Fetch main into the PR checkout
        working-directory: pr
        run: git fetch -q origin main:refs/remotes/origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: base/requirements.txt

      - name: Install (base requirements)
        run: pip install -q -r base/requirements.txt

      - name: 1. Protected paths and forbidden code
        working-directory: pr
        shell: bash
        run: |
          set -o pipefail
          echo "== 1. Protected paths and forbidden code ==" >> "$RUNNER_TEMP/gate.log"
          python ../base/gate/check_protected.py --base origin/main --head HEAD 2>&1 | tee -a "$RUNNER_TEMP/gate.log"

      - name: 2. Ledger entry
        working-directory: pr
        shell: bash
        run: |
          set -o pipefail
          echo "== 2. Ledger entry ==" >> "$RUNNER_TEMP/gate.log"
          python ../base/gate/check_ledger.py --base origin/main --head HEAD 2>&1 | tee -a "$RUNNER_TEMP/gate.log"

      - name: 3. Tests
        working-directory: pr
        shell: bash
        run: |
          set -o pipefail
          echo "== 3. Tests ==" >> "$RUNNER_TEMP/gate.log"
          python -m pytest tests -q 2>&1 | tee -a "$RUNNER_TEMP/gate.log"

      - name: 4. Backtest plausibility
        working-directory: pr
        shell: bash
        run: |
          set -o pipefail
          echo "== 4. Backtest plausibility ==" >> "$RUNNER_TEMP/gate.log"
          python ../base/gate/backtest_gate.py 2>&1 | tee -a "$RUNNER_TEMP/gate.log"

      # The agent cannot open this run's log, so a failure used to reach it as a link it could not follow, and it
      # could not tell a slip in its ledger entry from a failing test. The last lines the checks printed go out
      # as this workflow's `why`, for agent.yml's closing comment. The delimiter is made here, after the PR's own
      # code has run, so nothing that code printed can end the output early.
      - name: Why it failed
        id: why
        if: failure()
        shell: bash
        run: |
          end="GATE_SAID_$(openssl rand -hex 16)"
          {
            echo "why<<$end"
            if [ -s "$RUNNER_TEMP/gate.log" ]; then
              tail -n 60 "$RUNNER_TEMP/gate.log" | cut -c1-300 | tr -d '\r'
            else
              echo "the gate stopped before its first check (checkout or install failed)"
            fi
            echo "$end"
          } >> "$GITHUB_OUTPUT"
